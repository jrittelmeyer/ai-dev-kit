name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: installer + hooks (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24] # 22 = declared floor (oldest active LTS), 24 = current
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Version stamps agree
        run: node .github/check-version.mjs
      - name: Tag currency (advisory)
        run: node .github/check-tag-currency.mjs
      - name: Skill surface lints clean
        run: node .github/skill-lint.mjs
      - name: Skill eval anchors resolve
        run: node .github/skill-evals.mjs
      - name: Install into a scratch project
        run: node install.mjs --adapter adapters/next-web-boilerplate.json --dest scratch --hooks
      - name: Re-run is idempotent (0 files written)
        shell: bash
        run: |
          out=$(node install.mjs --adapter adapters/next-web-boilerplate.json --dest scratch --hooks)
          echo "$out"
          grep -q "0 file(s) written" <<<"$out"
      - name: Drift check is green
        run: node install.mjs --check --dest scratch
      - name: Hook handlers honor the fire/silent contract
        run: node .github/smoke-hooks.mjs
      - name: Settings merge + stale-prune scenarios
        run: node .github/smoke-installer.mjs
      - name: Self-install matches kit source
        run: node install.mjs --check
